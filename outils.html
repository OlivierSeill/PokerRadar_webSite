<!-- Menu connexion/création de compte afficher via JS : -->
        <div id="connexion" style="display: none">
            <h2>Connectez-vous ou rejoignez la communauté !</h2>
            <form action="#" method="POST">
                <label for="email">Email :</label>
                <input type="email" id="email" name="email" placeholder="exemple@mail.com" required autocomplete="email">
                <label for="mdp">Mot de passe :</label>
                <input type="password" id="mdp" name="mdp" placeholder="***" required autocomplete="current-password">
            
                <div class="submit-container">
                    <button type="submit">Se connecter</button>
                    <button type="reset">Réinitialiser</button>
